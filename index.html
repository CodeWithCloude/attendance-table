<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>สถิตินักเรียนมาเรียน</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#06c755">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="เช็คชื่อ">
<style>
  #install { display:none; background:#e8f9ef; border:2px solid var(--accent); }
  #install button { width:100%; background:var(--accent); color:#fff; font-weight:bold; font-size:20px; padding:16px; }
  #install .help { display:none; font-size:17px; line-height:1.7; margin-top:10px; }
  #install .x { background:none; color:#555; font-size:14px; padding:6px; margin-top:4px; width:auto; font-weight:normal; }
  :root { --ink:#111; --blue:#1a3fb0; --red:#c0261d; --line:#222; --bg:#f2f3f5; --card:#fff; --accent:#06c755; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:Tahoma,"Noto Sans Thai","Sarabun",sans-serif; }
  .wrap { max-width:760px; margin:0 auto; padding:12px 16px 90px; }
  h1 { font-size:18px; margin:8px 0 12px; }
  .card { background:var(--card); border-radius:12px; padding:12px; margin-bottom:12px; box-shadow:0 1px 3px #0002; }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  label { font-size:14px; }
  input { font:inherit; }
  input[type=date], input[type=text] { padding:8px; border:1px solid #bbb; border-radius:8px; }
  .tablebox { overflow-x:auto; }
  table { border-collapse:collapse; width:100%; min-width:560px; background:#fff; }
  th, td { border:1.5px solid var(--line); text-align:center; padding:4px 2px; font-size:15px; }
  th { background:#eef1f6; }
  td.room { font-weight:bold; white-space:nowrap; padding:4px 8px; }
  tr.sum td { font-weight:bold; background:#f7f7f7; }
  td input.num { width:100%; max-width:64px; padding:8px 2px; text-align:center; font-size:18px; color:var(--blue); border:1px solid #9ab; border-radius:6px; }
  td input.num.bad { border-color:var(--red); background:#ffe3e1; }
  .abs { color:var(--red); }
  .pres { color:var(--blue); }
  .warn { color:var(--red); font-size:14px; min-height:20px; margin:6px 0 0; }
  .bar { position:fixed; left:0; right:0; bottom:0; background:#fff; border-top:1px solid #ccc; padding:10px 16px; display:flex; gap:8px; justify-content:center; }
  button { font:inherit; font-size:16px; border:0; border-radius:10px; padding:12px 18px; background:#e3e5ea; cursor:pointer; }
  button.main { background:var(--accent); color:#fff; font-weight:bold; flex:1; max-width:340px; }
  details summary { cursor:pointer; font-weight:bold; }
  .cfg td input { width:60px; padding:6px; text-align:center; border:1px solid #bbb; border-radius:6px; }
  #preview { max-width:100%; border:1px solid #ccc; border-radius:8px; margin-top:8px; display:none; }
  #modal { display:none; position:fixed; inset:0; background:#000b; z-index:20; align-items:center; justify-content:center; padding:12px; }
  #modal .mbox { background:#fff; border-radius:14px; padding:14px; max-width:900px; width:100%; max-height:100%; overflow:auto; text-align:center; }
  #modal p { font-size:18px; line-height:1.5; margin:0 0 10px; }
  #modal img { width:100%; border:1px solid #ccc; border-radius:8px; margin-bottom:10px; -webkit-touch-callout:default; user-select:auto; }
  #modal button { width:100%; max-width:none; }
  #toast { position:fixed; left:50%; bottom:80px; transform:translateX(-50%); background:#222; color:#fff; padding:10px 16px; border-radius:20px; font-size:15px; display:none; z-index:9; }
  /* แนวนอน: ใช้พื้นที่เต็มจอ ตารางไม่ต้องเลื่อน */
  @media (orientation:landscape) {
    .wrap { max-width:1100px; padding:6px 12px 70px; }
    h1 { display:none; }
    table { min-width:0; }
    th, td { font-size:14px; padding:2px; }
    td input.num { padding:4px 2px; font-size:17px; }
    .card { padding:8px; margin-bottom:8px; }
    .bar { padding:6px 12px; }
    button { padding:8px 16px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>สถิตินักเรียนมาเรียน</h1>

  <div class="card" id="install">
    <button id="installBtn">📲 ใส่ไว้หน้าจอมือถือ</button>
    <div class="help" id="help"></div>
    <button class="x" id="hideInstall">ไม่ต้องแสดงอีก</button>
  </div>

  <div class="card row">
    <label>วันที่ <input type="date" id="date"></label>
    <label>ชั้น ป. <input type="text" id="grade" size="3" style="width:60px"></label>
  </div>

  <div class="card">
    <div class="tablebox">
      <table id="tbl"></table>
    </div>
    <p class="warn" id="warn"></p>
    <p style="font-size:13px;color:#555;margin:6px 0 0">กรอกเฉพาะช่องสีน้ำเงิน (ชายและหญิงที่มาเรียน) ที่เหลือคำนวณให้อัตโนมัติ</p>
  </div>

  <details class="card cfg">
    <summary>ตั้งค่าจำนวนนักเรียนทั้งหมด (ตั้งครั้งเดียว)</summary>
    <div id="cfg" style="margin-top:10px"></div>
    <div class="row" style="margin-top:8px">
      <button id="addRoom">+ เพิ่มห้อง</button>
      <button id="delRoom">− ลบห้องสุดท้าย</button>
    </div>
  </details>

  <img id="preview" alt="ตัวอย่างรูป">
</div>

<div class="bar">
  <button id="save" class="main">บันทึกรูป</button>
</div>
<div id="modal">
  <div class="mbox">
    <p id="mStatus"></p>
    <img id="mImg" alt="รูปตาราง">
    <button id="mClose" class="main">ปิด</button>
  </div>
</div>

<script>
const KEY = "attendance-v1";
const DAYS = ["อาทิตย์","จันทร์","อังคาร","พุธ","พฤหัสบดี","ศุกร์","เสาร์"];
const MONTHS = ["มกราคม","กุมภาพันธ์","มีนาคม","เมษายน","พฤษภาคม","มิถุนายน","กรกฎาคม","สิงหาคม","กันยายน","ตุลาคม","พฤศจิกายน","ธันวาคม"];

let st = { grade:"3", rooms:[{b:17,g:9},{b:18,g:10},{b:14,g:11},{b:15,g:11}], pres:[] };
try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && s.rooms) st = s; } catch(e){}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(st)); } catch(e){} }

const $ = id => document.getElementById(id);
const dateEl = $("date");
function todayStr(){ const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
dateEl.value = todayStr();
$("grade").value = st.grade;

function thaiDate(){
  const [y,m,d] = dateEl.value.split("-").map(Number);
  const dt = new Date(y,m-1,d);
  return { day:DAYS[dt.getDay()], d, month:MONTHS[m-1], year:y+543 };
}
const val = v => (v === "" || v == null) ? null : Number(v);

function compute(){
  const rows = st.rooms.map((r,i)=>{
    const p = st.pres[i] || {};
    const pb = val(p.b), pg = val(p.g);
    const filled = pb!=null && pg!=null;
    return { name:`ป.${st.grade}/${i+1}`, tb:r.b, tg:r.g, tt:r.b+r.g,
      pb, pg, filled,
      pt: filled ? pb+pg : null,
      ab: filled ? r.b-pb : null, ag: filled ? r.g-pg : null,
      at: filled ? (r.b-pb)+(r.g-pg) : null,
      bad: filled && (pb>r.b || pg>r.g || pb<0 || pg<0) };
  });
  const S = k => rows.reduce((a,r)=>a+(r[k]||0),0);
  const total = { name:"รวม", tb:S("tb"), tg:S("tg"), tt:S("tt"), pb:S("pb"), pg:S("pg"), pt:S("pt"), ab:S("ab"), ag:S("ag"), at:S("at") };
  return { rows, total };
}
const f = v => v==null ? "" : v;

function render(){
  const {rows,total} = compute();
  let h = `<tr><th rowspan="3">ชั้น</th><th colspan="3">จำนวนทั้งหมด</th><th colspan="3">มาเรียน</th><th colspan="3">ไม่มาเรียน</th></tr>
  <tr>${"<th>ชาย</th><th>หญิง</th><th>รวม</th>".repeat(3)}</tr>`;
  h = h.replace('<th rowspan="3">','<th rowspan="2">');
  rows.forEach((r,i)=>{
    const p = st.pres[i] || {};
    h += `<tr><td class="room">${r.name}</td><td>${r.tb}</td><td>${r.tg}</td><td>${r.tt}</td>
    <td><input class="num ${r.bad?'bad':''}" inputmode="numeric" data-i="${i}" data-k="b" value="${f(p.b)}"></td>
    <td><input class="num ${r.bad?'bad':''}" inputmode="numeric" data-i="${i}" data-k="g" value="${f(p.g)}"></td>
    <td class="pres">${f(r.pt)}</td>
    <td class="abs">${f(r.ab)}</td><td class="abs">${f(r.ag)}</td><td class="abs">${f(r.at)}</td></tr>`;
  });
  h += `<tr class="sum"><td>รวม</td><td>${total.tb}</td><td>${total.tg}</td><td>${total.tt}</td>
    <td class="pres">${total.pb}</td><td class="pres">${total.pg}</td><td class="pres">${total.pt}</td>
    <td class="abs">${total.ab}</td><td class="abs">${total.ag}</td><td class="abs">${total.at}</td></tr>`;
  $("tbl").innerHTML = h;
  $("warn").textContent = rows.some(r=>r.bad) ? "⚠ มีห้องที่จำนวนที่มาเรียนมากกว่าจำนวนทั้งหมด กรุณาตรวจสอบ" : "";
  $("tbl").querySelectorAll("input.num").forEach(el=>{
    el.addEventListener("input", ()=>{
      const i = +el.dataset.i;
      st.pres[i] = st.pres[i] || {};
      st.pres[i][el.dataset.k] = el.value.replace(/\D/g,"");
      save();
      const focus = {i:el.dataset.i,k:el.dataset.k};
      render();
      const n = document.querySelector(`input[data-i="${focus.i}"][data-k="${focus.k}"]`);
      if (n){ n.focus(); n.setSelectionRange(n.value.length,n.value.length); }
    });
  });
  renderCfg();
}

function renderCfg(){
  let h = `<table><tr><th>ห้อง</th><th>ชายทั้งหมด</th><th>หญิงทั้งหมด</th></tr>`;
  st.rooms.forEach((r,i)=>{
    h += `<tr><td class="room">ป.${st.grade}/${i+1}</td>
    <td><input inputmode="numeric" data-ci="${i}" data-ck="b" value="${r.b}"></td>
    <td><input inputmode="numeric" data-ci="${i}" data-ck="g" value="${r.g}"></td></tr>`;
  });
  $("cfg").innerHTML = h + "</table>";
  $("cfg").querySelectorAll("input").forEach(el=>{
    el.addEventListener("change", ()=>{
      st.rooms[+el.dataset.ci][el.dataset.ck] = Number(el.value.replace(/\D/g,""))||0;
      save(); render();
    });
  });
}

$("grade").addEventListener("input", e=>{ st.grade = e.target.value.trim(); save(); render(); });
dateEl.addEventListener("change", ()=>{ if(!dateEl.value) dateEl.value=todayStr(); });
$("addRoom").onclick = ()=>{ st.rooms.push({b:0,g:0}); save(); render(); };
$("delRoom").onclick = ()=>{ if(st.rooms.length>1){ st.rooms.pop(); st.pres.length=Math.min(st.pres.length,st.rooms.length); save(); render(); } };

/* ---------- วาดรูป PNG ---------- */
function drawCanvas(){
  const {rows,total} = compute();
  const W=1400, left=150, cw=(W-left)/9, rh=84, top=130;
  const nRows = rows.length+1, H = top + 2*rh + nRows*rh + 40;
  const c = document.createElement("canvas"); c.width=W; c.height=H;
  const x = c.getContext("2d");
  const FONT = 'Tahoma,"Noto Sans Thai",sans-serif';
  x.fillStyle="#fff"; x.fillRect(0,0,W,H);
  x.strokeStyle="#222"; x.lineWidth=3; x.fillStyle="#111"; x.textAlign="center"; x.textBaseline="middle";
  const t = thaiDate();
  const cellBox = (cx,cy,w,h,fill)=>{ if(fill){x.fillStyle=fill;x.fillRect(cx,cy,w,h);} x.strokeRect(cx,cy,w,h); };
  /* ย่อขนาดตัวอักษรให้พอดีช่องเสมอ — ไม่ขึ้นกับฟอนต์/ขนาดจอของเครื่อง */
  const fit = (s,maxW,size,bold)=>{ let z=size; do { x.font=`${bold?"bold ":""}${z}px ${FONT}`; z-=2; } while (x.measureText(s).width>maxW && z>12); };
  const txt = (s,cx,cy,w,h,color,bold,size)=>{ s=String(s); x.fillStyle=color||"#111"; fit(s,w-16,size||38,bold); x.fillText(s,cx+w/2,cy+h/2+2); };
  { const title=`สถิตินักเรียนชั้นประถมศึกษาปีที่ ${st.grade}   วัน${t.day} ที่ ${t.d} เดือน${t.month} พ.ศ. ${t.year}`; fit(title,W-40,36,true); x.fillText(title, W/2, 55); }
  // header
  cellBox(0,top,left,2*rh,"#eef1f6"); txt("ชั้น",0,top,left,2*rh,"#111",true);
  ["จำนวนทั้งหมด","มาเรียน","ไม่มาเรียน"].forEach((s,g)=>{
    cellBox(left+g*3*cw,top,3*cw,rh,"#eef1f6"); txt(s,left+g*3*cw,top,3*cw,rh,"#111",true);
    ["ชาย","หญิง","รวม"].forEach((u,j)=>{ cellBox(left+(g*3+j)*cw,top+rh,cw,rh,"#eef1f6"); txt(u,left+(g*3+j)*cw,top+rh,cw,rh,"#111",true); });
  });
  const all = rows.concat([Object.assign({}, total, {sum:true})]);
  all.forEach((r,i)=>{
    const y = top+2*rh+i*rh;
    const bg = r.sum ? "#f1f1f1" : null;
    cellBox(0,y,left,rh,bg); txt(r.name,0,y,left,rh,"#111",true,36);
    const cells = [[r.tb,"#111"],[r.tg,"#111"],[r.tt,"#111"],[r.pb,"#1a3fb0"],[r.pg,"#1a3fb0"],[r.pt,"#1a3fb0"],[r.ab,"#c0261d"],[r.ag,"#c0261d"],[r.at,"#c0261d"]];
    cells.forEach(([v,col],j)=>{ cellBox(left+j*cw,y,cw,rh,bg); txt(f(v),left+j*cw,y,cw,rh,col,!!r.sum||j>=3,44); });
  });
  return c;
}
function blobOf(){ return new Promise(res=>drawCanvas().toBlob(res,"image/png")); }
function fname(){ return `สถิตินักเรียน_ป${st.grade}_${dateEl.value}.png`; }
async function download(blob){
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=fname(); a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),4000);
}
/* หน้าต่างแสดงรูป + บอกผลทุกครั้ง: ถ้าปุ่มอัตโนมัติใช้ไม่ได้ ให้กดค้างที่รูปได้เสมอ */
function showModal(blob, status){
  if (showModal.url) URL.revokeObjectURL(showModal.url);
  showModal.url = URL.createObjectURL(blob);
  $("mImg").src = showModal.url;
  $("mStatus").textContent = status;
  $("modal").style.display = "flex";
}
$("mClose").onclick = ()=>{ $("modal").style.display="none"; };
const pressHint = " หากต้องการ ให้กดค้างที่รูป แล้วเลือก คัดลอก / แชร์ / บันทึกรูปภาพ";
async function getBlob(){
  const b = await blobOf();
  if (!b) throw new Error("สร้างรูปไม่สำเร็จ");
  return b;
}
$("save").onclick = async ()=>{
  let blob;
  try { blob = await getBlob(); } catch(e){ alert("สร้างรูปไม่สำเร็จ: "+e.message); return; }
  try { await download(blob); showModal(blob, "✅ สั่งบันทึกรูปแล้ว (ดูในโฟลเดอร์ดาวน์โหลด/รูปภาพ)." + pressHint); }
  catch(e){ showModal(blob, "⚠ บันทึกอัตโนมัติไม่ได้." + pressHint); }
};

render();

/* ---------- ใส่ไว้หน้าจอมือถือ ---------- */
(function(){
  if ("serviceWorker" in navigator && location.protocol.startsWith("http")) navigator.serviceWorker.register("sw.js").catch(()=>{});
  const standalone = matchMedia("(display-mode: standalone)").matches || navigator.standalone;
  let hidden=false; try { hidden = localStorage.getItem("hideInstall")==="1"; } catch(e){}
  const box=$("install"), help=$("help"); let deferred=null;
  const ua = navigator.userAgent, isIOS=/iPhone|iPad|iPod/.test(ua), isMobile=/Android|iPhone|iPad|iPod/.test(ua);
  if (standalone || hidden || !isMobile) return;
  box.style.display="block";
  window.addEventListener("beforeinstallprompt", e=>{ e.preventDefault(); deferred=e; });
  window.addEventListener("appinstalled", ()=>{ box.style.display="none"; });
  $("installBtn").onclick = async ()=>{
    if (deferred) { deferred.prompt(); await deferred.userChoice; deferred=null; return; }
    help.style.display="block";
    help.innerHTML = isIOS
      ? "<b>บน iPhone:</b><br>1. กดปุ่ม <b>แชร์</b> (ไอคอนสี่เหลี่ยมมีลูกศรชี้ขึ้น) ด้านล่างจอ<br>2. เลื่อนลงแล้วกด <b>เพิ่มลงในหน้าจอโฮม</b><br>3. กด <b>เพิ่ม</b> (ต้องเปิดด้วย Safari)"
      : "<b>บน Android:</b><br>1. กดปุ่ม <b>⋮</b> (สามจุด) มุมขวาบนของ Chrome<br>2. กด <b>เพิ่มไปยังหน้าจอหลัก</b> หรือ <b>ติดตั้งแอป</b><br>3. กด <b>เพิ่ม</b>";
  };
  $("hideInstall").onclick = ()=>{ box.style.display="none"; try{ localStorage.setItem("hideInstall","1"); }catch(e){} };
})();
</script>
</body>
</html>
